name: Release SDKs

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - id: version
        run: python scripts/check-release.py

  tests:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Build npm package
        working-directory: typescript
        run: |
          npm ci
          mkdir -p ../dist/npm ../dist/python
          npm pack --pack-destination ../dist/npm
      - name: Build and check Python distributions
        run: |
          python -m pip install build twine
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python -m build --outdir dist/python python
          python -m twine check dist/python/*
      - name: Prepare release notes and checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cp "changelog/${VERSION}-changelog.md" dist/RELEASE_NOTES.md
          cd dist
          sha256sum npm/*.tgz python/*.whl python/*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-release
          path: dist/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-release
          path: dist
      - name: Verify artifact checksums
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Verify trusted publisher without publishing
        run: node scripts/check-publisher.mjs npm
      - name: Publish npm package
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: npm publish dist/npm/*.tgz --access public --tag latest --ignore-scripts

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-release
          path: dist
      - name: Verify artifact checksums
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Verify trusted publisher without publishing
        run: node scripts/check-publisher.mjs pypi
      - name: Publish Python distributions
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/python/

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, npm, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-release
          path: dist
      - name: Publish GitHub release with the uploaded packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          { (cd npm && sha256sum *.tgz); (cd python && sha256sum *.whl *.tar.gz); } > SHA256SUMS
          gh release create "$TAG" --verify-tag --title "MythicMC SDK ${TAG#v}" --notes-file RELEASE_NOTES.md npm/*.tgz python/*.whl python/*.tar.gz SHA256SUMS
