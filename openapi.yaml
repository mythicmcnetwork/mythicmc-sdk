openapi: 3.1.0
info:
  title: MythicMC Public API
  version: 1.0.0
  summary: Read-only player, statistics and leaderboard data from the MythicMC network.
  description: |
    Player profiles, Survival stats, progression, teams, crate keys, and leaderboards
    for the official MythicMC SDKs.

    Send your API key in `Authorization: Bearer <key>`. Only `/health` works without a key.
    Create a key at https://developer.mythicmc.net/. Production keys use development
    limits until approved. The SDK endpoints below do not accept query parameters.

    Gameplay data is delayed by at least five minutes. `X-Data-As-Of` gives the UTC
    cutoff used for every field in the response. Numeric timestamps are Unix
    milliseconds; fields that use ISO 8601 are marked below.

    `null` means unknown, a missing optional group means unpublished, and an empty
    array means there are no entries. Unknown values are never replaced with zero.

    Responses may be reused from the origin cache for up to 15 seconds. Cache hits
    still require a valid key and count toward its per-minute limit. `X-Cache` shows
    the cache result. Responses use `Cache-Control: no-store` for browsers; the API
    manages its own origin and edge caches.

    Errors use `{"error": "..."}`. Handle them by HTTP status, since messages can
    change. All 5xx responses use `required data is unavailable` without exposing
    the underlying cause.
  license:
    name: MIT
    identifier: MIT
externalDocs:
  description: Full API reference
  url: https://developer.mythicmc.net/#reference
servers:
  - url: https://api.mythicmc.net
security:
  - apiKey: []
tags:
  - name: Players
    description: Profiles, Survival statistics, progression, teams and crate keys.
  - name: Leaderboards
    description: Survival leaderboards by type and period.
  - name: Service
    description: API process status.
paths:
  /v1/players/{id}:
    get:
      operationId: getPlayer
      tags: [Players]
      summary: Get player profile
      description: |
        A player's network profile, including players who have never played Survival.
      parameters:
        - $ref: '#/components/parameters/PlayerId'
      responses:
        '200': { $ref: '#/components/responses/ProfileOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/PlayerNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/players/{id}/stats:
    get:
      operationId: getPlayerStats
      tags: [Players]
      summary: Get Survival statistics
      description: |
        Survival statistics from the player's published profile. Returns 404 if no
        Survival snapshot is available. These are delayed snapshots, not live stats.
      parameters:
        - $ref: '#/components/parameters/PlayerId'
      responses:
        '200': { $ref: '#/components/responses/StatsOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/StatsNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/players/{id}/progression:
    get:
      operationId: getPlayerProgression
      tags: [Players]
      summary: Get network level
      description: |
        Network level, XP, and public achievements. Network levels are separate from
        Minecraft experience levels and team levels.
      parameters:
        - $ref: '#/components/parameters/PlayerId'
      responses:
        '200': { $ref: '#/components/responses/ProgressionOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/PlayerNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/players/{id}/team:
    get:
      operationId: getPlayerTeam
      tags: [Players]
      summary: Get player team
      description: The player's team and role. `team` is `null` if they have no team.
      parameters:
        - $ref: '#/components/parameters/PlayerId'
      responses:
        '200': { $ref: '#/components/responses/TeamOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/PlayerNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/players/{id}/crate-keys:
    get:
      operationId: getPlayerCrateKeys
      tags: [Players]
      summary: Get crate key balances
      description: |
        Available crate key balances. Missing crates have unpublished balances, not
        zero balances.
      parameters:
        - $ref: '#/components/parameters/PlayerId'
      responses:
        '200': { $ref: '#/components/responses/CrateKeysOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/PlayerNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/leaderboards:
    get:
      operationId: listLeaderboards
      tags: [Leaderboards]
      summary: List leaderboards
      description: Available Survival leaderboards and their supported periods.
      responses:
        '200': { $ref: '#/components/responses/LeaderboardsOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/leaderboards/{type}/{period}:
    get:
      operationId: getLeaderboard
      tags: [Leaderboards]
      summary: Get a leaderboard
      description: |
        Up to 15 ranked players for a Survival leaderboard. Values are formatted
        strings, such as `3d 4h` or `$2.83B`.
      parameters:
        - name: type
          in: path
          required: true
          schema: { $ref: '#/components/schemas/LeaderboardType' }
        - name: period
          in: path
          required: true
          description: '`networth` supports `all_time` only; the other boards support all four.'
          schema: { $ref: '#/components/schemas/LeaderboardPeriod' }
      responses:
        '200': { $ref: '#/components/responses/LeaderboardOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/LeaderboardNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /health:
    get:
      operationId: health
      tags: [Service]
      summary: Health check
      description: |
        Checks whether the API process is running. No API key or rate limit applies.
        This does not check game servers or data availability.
      security: []
      responses:
        '200':
          description: The API is up.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
              example: { ok: true }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: |
        Send the developer key as `Authorization: Bearer <key>`. Keys start with `mmc_`.
        Limits reset in fixed one-minute windows. `X-RateLimit-Limit-Minute` shows
        the key's current allowance.
  parameters:
    PlayerId:
      name: id
      in: path
      required: true
      description: |
        Minecraft username or UUID, case-insensitive. Bedrock names may start with `.`.
        UUIDs work with or without dashes; responses use lowercase UUIDs with dashes.
      schema:
        type: string
        pattern: '^(?:[0-9a-fA-F]{32}|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|\.?[A-Za-z0-9_]{1,16})$'
      example: Vicente_1313
  headers:
    DataDelaySeconds:
      description: Always `300`. Gameplay data is at least five minutes old.
      schema: { type: integer }
    DataAsOf:
      description: |
        Response cutoff in RFC 3339 UTC. Fresh reads use the current time minus five
        minutes; cached reads retain their original cutoff. This is not a player's
        last activity time.
      schema: { type: string, format: date-time }
    Cache:
      description: |
        Cache result. `COALESCED` means the request shared a read already in progress.
        Cached responses last up to 15 seconds. Omitted from error responses.
      schema: { type: string, enum: [HIT, MISS, COALESCED] }
    CacheControl:
      description: Always `no-store`, on every response including errors.
      schema: { type: string }
    RateLimitMinute:
      description: |
        Requests allowed for this key in the current minute, including cache hits.
        Included on responses to recognised keys, even when the request fails.
      schema: { type: integer }
    RetryAfter:
      description: Whole seconds until the current one-minute window resets.
      schema: { type: integer }
  responses:
    ProfileOk:
      description: The player profile.
      headers: &dataHeaders
        X-Data-Delay-Seconds: { $ref: '#/components/headers/DataDelaySeconds' }
        X-Data-As-Of: { $ref: '#/components/headers/DataAsOf' }
        X-Cache: { $ref: '#/components/headers/Cache' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-RateLimit-Limit-Minute: { $ref: '#/components/headers/RateLimitMinute' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlayerProfile' }
          example:
            uuid: 53eefb84-3ed8-4efb-9bb0-ddaaf3e01e9f
            name: Vicente_1313
            rank: { id: divine, label: DIVINE, weight: 40, color: '#b983ff' }
            playtimeMinutes: 18240
            firstLogin: 1719878400000
            lastLogin: 1758226800000
            lastLogout: null
            online: true
            location: { gamemode: survival }
            level: 37
            team: { id: 6f1c2a9e-3b7d-4e0a-9c55-1d2e3f4a5b6c, name: Nightfall, prefix: NF, level: 12, role: officer }
            cosmetics:
              selected:
                - { slot: hat, id: witch-hat, name: Witch Hat, category: hat, preview: null }
            skin:
              textureUrl: https://textures.minecraft.net/texture/2c7a608fb2917a75164dc04dfbc7d4fe0d1e5b05b929381df20bb26853cb60f2
              model: classic
    StatsOk:
      description: The player's Survival statistics.
      headers: *dataHeaders
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlayerStats' }
          example:
            uuid: 53eefb84-3ed8-4efb-9bb0-ddaaf3e01e9f
            name: Vicente_1313
            survival:
              level: 42
              money: 1250340.5
              playtimeMinutes: 9120
              spawners: 3
              ranks: { kills: 14, playtime: 52 }
              combat: { kills: 318, deaths: 97, mobKills: 12044, damageDealt: 88412.5, damageTaken: 40210 }
              world:
                blocksMined: 402118
                blocksPlaced: 188305
                itemsCrafted: 22190
                distanceKm: 1840.2
                jumps: 96012
                fishCaught: 410
                animalsBred: 233
                villagerTrades: 1502
                itemsEnchanted: 188
                raidsWon: 4
              events:
                points: 120
                pointsLifetime: 2210
                tickets: 3
                ticketsEarned: 41
                raffleLuck: 1.25
                rafflesEntered: 18
                bingoFinished: 6
                bingoPodiums: 2
                wins: { bingo: 1, raffle: 2, chatGame: 19 }
              auction: { activeListings: 2, sold: 88, soldValue: 412000, bought: 51, boughtValue: 198500, openOrders: 1 }
              bounty: { onHead: 25000, claimed: 7, claimedValue: 61000, claimedOn: 3 }
              netWorth: { total: 2830000.75, rank: 9 }
    ProgressionOk:
      description: Network progression.
      headers: *dataHeaders
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlayerProgression' }
          example:
            uuid: 53eefb84-3ed8-4efb-9bb0-ddaaf3e01e9f
            name: Vicente_1313
            level: 37
            experience: 67410
            progress: 810
            target: 3700
            maxed: false
            achievements:
              - id: first-blood
                name: First Blood
                description: Win your first fight on Survival.
                progress: 1
                target: 1
                complete: true
                unlockedAt: '2026-07-02T01:14:52.000Z'
    TeamOk:
      description: Team membership.
      headers: *dataHeaders
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlayerTeam' }
          example:
            uuid: 53eefb84-3ed8-4efb-9bb0-ddaaf3e01e9f
            name: Vicente_1313
            team: { id: 6f1c2a9e-3b7d-4e0a-9c55-1d2e3f4a5b6c, name: Nightfall, prefix: NF, level: 12, role: officer }
    CrateKeysOk:
      description: Key balances.
      headers: *dataHeaders
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlayerCrateKeys' }
          example:
            uuid: 53eefb84-3ed8-4efb-9bb0-ddaaf3e01e9f
            name: Vicente_1313
            keys:
              - { crateId: vote, keyType: virtual, available: 12 }
              - { crateId: legendary, keyType: virtual, available: 1 }
    LeaderboardsOk:
      description: Board types and periods.
      headers: *dataHeaders
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LeaderboardIndex' }
          example:
            types: [kills, playtime, wins, networth]
            periods: [daily, weekly, monthly, all_time]
            boards:
              kills: [daily, weekly, monthly, all_time]
              playtime: [daily, weekly, monthly, all_time]
              wins: [daily, weekly, monthly, all_time]
              networth: [all_time]
    LeaderboardOk:
      description: The board.
      headers: *dataHeaders
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Leaderboard' }
          example:
            type: kills
            period: weekly
            rows:
              - { rank: 1, uuid: 53eefb84-3ed8-4efb-9bb0-ddaaf3e01e9f, name: Vicente_1313, value: '412' }
            stale: false
            windowStart: '2026-09-18T04:00:00.000Z'
            windowEnd: '2026-09-25T04:00:00.000Z'
    BadRequest:
      description: |
        Invalid username or UUID, or an unsupported query parameter.
      headers: &errorHeaders
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-RateLimit-Limit-Minute: { $ref: '#/components/headers/RateLimitMinute' }
        X-Data-Delay-Seconds: { $ref: '#/components/headers/DataDelaySeconds' }
        X-Data-As-Of: { $ref: '#/components/headers/DataAsOf' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: invalid player identifier }
    Unauthorized:
      description: |
        Missing bearer token, invalid key, or revoked key. Revocation takes effect
        on the next request.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: missing or invalid API key }
    PlayerNotFound:
      description: No published player profile matches this name or UUID.
      headers: *errorHeaders
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: unknown player }
    StatsNotFound:
      description: |
        The player is unknown or has no published Survival statistics.
      headers: *errorHeaders
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: no Survival snapshot }
    LeaderboardNotFound:
      description: Unknown board type, or a period that board does not support.
      headers: *errorHeaders
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: unknown leaderboard }
    RateLimited:
      description: |
        The key has reached its per-minute limit. Cache hits count toward this limit.
        There is no daily cap.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-RateLimit-Limit-Minute: { $ref: '#/components/headers/RateLimitMinute' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: too many requests }
    Unavailable:
      description: |
        Data is not yet published, storage is unavailable, or the username matches
        more than one player. The error message does not distinguish these cases.
        Try again later; if a username keeps failing, use the player's UUID.
      headers: *errorHeaders
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: required data is unavailable }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Error message. Use the HTTP status for error handling; wording may change.
    Uuid:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: Lowercase dashed UUID.
    PlayerName:
      type: string
      pattern: '^\.?[A-Za-z0-9_]{1,16}$'
      description: Username as known at the cutoff. Bedrock names keep their leading dot.
    Id:
      type: string
      pattern: '^[a-z0-9_-]{1,64}$'
      description: Stable lowercase identifier for lookups and comparisons.
    Rank:
      type: object
      description: |
        Public rank, without permissions or staff status. Defaults to the lowest
        public rank when no rank is published.
      required: [id, label, weight, color]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        label: { type: string, minLength: 1, maxLength: 32, description: 'Display name, such as `DIVINE`.' }
        weight: { type: integer, minimum: 0, description: Ordering weight published by the network. }
        color:
          type: [string, 'null']
          pattern: '^#[0-9a-f]{6}$'
          description: Lowercase hex display colour, or `null` when the rank has none.
    TeamSummary:
      type: object
      required: [id, name, prefix, level]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 24 }
        prefix: { type: string, maxLength: 32, description: Public display tag; may be empty. }
        level: { type: integer, minimum: 0, description: 'Team level, separate from player levels.' }
        role:
          type: string
          enum: [leader, officer, member]
          description: The player's role, if published.
    SelectedCosmetic:
      type: object
      required: [slot, id, name, category, preview]
      properties:
        slot: { $ref: '#/components/schemas/Id' }
        id: { type: string, minLength: 1, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 128, description: Display name. }
        category: { $ref: '#/components/schemas/Id' }
        preview:
          type: [string, 'null']
          format: uri
          description: HTTPS preview image, or `null` when none is published.
    Skin:
      type: object
      description: Public skin texture.
      required: [textureUrl, model]
      properties:
        textureUrl:
          type: string
          format: uri
          pattern: '^https://textures\.minecraft\.net/texture/[a-fA-F0-9]+$'
        model: { type: string, enum: [slim, classic] }
    PlayerProfile:
      type: object
      required: [uuid, name, rank, playtimeMinutes, firstLogin, lastLogin, lastLogout, online, location, level, team, cosmetics]
      properties:
        uuid: { $ref: '#/components/schemas/Uuid' }
        name: { $ref: '#/components/schemas/PlayerName' }
        rank: { $ref: '#/components/schemas/Rank' }
        playtimeMinutes:
          type: [integer, 'null']
          minimum: 0
          description: Whole minutes of public network playtime, or `null` when unknown.
        firstLogin:
          type: [integer, 'null']
          minimum: 1
          description: |
            First public network login, Unix milliseconds, or `null` when unknown.
            Logins are network connections, not transfers between servers.
        lastLogin: { type: [integer, 'null'], minimum: 1, description: 'Most recent public login, Unix milliseconds, or `null`.' }
        lastLogout:
          type: [integer, 'null']
          minimum: 1
          description: |
            Most recent public logout, Unix milliseconds, or `null`. While the player is
            online this is the end of their previous session.
        online:
          type: [boolean, 'null']
          description: |
            Online status at the cutoff. `null` if the last observation is over 90
            seconds older than the cutoff. Hidden players return `false`.
        location:
          type: [object, 'null']
          description: |
            Gamemode at the cutoff, available only when `online` is `true`. Otherwise
            `null`. Specific servers, shards, and lobbies are not exposed.
          required: [gamemode]
          properties:
            gamemode: { $ref: '#/components/schemas/Id' }
        level:
          type: [integer, 'null']
          minimum: 0
          description: Network level, or `null` when it has not been published.
        team:
          description: '`null` when the player is not in a team.'
          oneOf:
            - $ref: '#/components/schemas/TeamSummary'
            - type: 'null'
        cosmetics:
          type: object
          required: [selected]
          properties:
            selected:
              type: [array, 'null']
              maxItems: 32
              description: |
                Cosmetics the player has equipped. `null` when no cosmetics snapshot has
                been published; `[]` when nothing is selected.
              items: { $ref: '#/components/schemas/SelectedCosmetic' }
        skin:
          description: Omitted entirely when no skin has been published. Never `null`.
          $ref: '#/components/schemas/Skin'
    SurvivalStats:
      type: object
      description: |
        `combat` and `world` are always included. Other fields and groups are omitted
        when unpublished. Missing data means unknown, not zero. Damage uses health
        points; distance uses kilometres.
      required: [combat, world]
      properties:
        level: { type: integer, minimum: 0, description: Minecraft experience level on Survival. }
        money: { type: number, minimum: 0, description: Public economy balance. }
        playtimeMinutes: { type: integer, minimum: 0, description: "Whole minutes, as used by Survival's profile." }
        spawners: { type: integer, minimum: 0 }
        ranks:
          type: object
          description: Leaderboard positions. `0` means unranked.
          required: [kills, playtime]
          properties:
            kills: { type: integer, minimum: 0 }
            playtime: { type: integer, minimum: 0 }
        combat:
          type: object
          required: [kills, deaths, mobKills, damageDealt, damageTaken]
          properties:
            kills: { type: integer, minimum: 0 }
            deaths: { type: integer, minimum: 0 }
            mobKills: { type: integer, minimum: 0 }
            damageDealt: { type: number, minimum: 0 }
            damageTaken: { type: number, minimum: 0 }
        world:
          type: object
          required: [blocksMined, blocksPlaced, itemsCrafted, distanceKm, jumps, fishCaught, animalsBred, villagerTrades, itemsEnchanted, raidsWon]
          properties:
            blocksMined: { type: integer, minimum: 0 }
            blocksPlaced: { type: integer, minimum: 0 }
            itemsCrafted: { type: integer, minimum: 0 }
            distanceKm: { type: number, minimum: 0 }
            jumps: { type: integer, minimum: 0 }
            fishCaught: { type: integer, minimum: 0 }
            animalsBred: { type: integer, minimum: 0 }
            villagerTrades: { type: integer, minimum: 0 }
            itemsEnchanted: { type: integer, minimum: 0 }
            raidsWon: { type: integer, minimum: 0 }
        events:
          type: object
          required: [points, pointsLifetime, tickets, ticketsEarned, raffleLuck, rafflesEntered, bingoFinished, bingoPodiums, wins]
          properties:
            points: { type: integer, minimum: 0, description: Current event points. }
            pointsLifetime: { type: integer, minimum: 0 }
            tickets: { type: integer, minimum: 0 }
            ticketsEarned: { type: integer, minimum: 0 }
            raffleLuck: { type: number, minimum: 0 }
            rafflesEntered: { type: integer, minimum: 0 }
            bingoFinished: { type: integer, minimum: 0 }
            bingoPodiums: { type: integer, minimum: 0 }
            wins:
              type: object
              required: [bingo, raffle, chatGame]
              properties:
                bingo: { type: integer, minimum: 0 }
                raffle: { type: integer, minimum: 0 }
                chatGame: { type: integer, minimum: 0 }
        auction:
          type: object
          description: Aggregate counts and amounts, not listings.
          required: [activeListings, sold, soldValue, bought, boughtValue, openOrders]
          properties:
            activeListings: { type: integer, minimum: 0 }
            sold: { type: integer, minimum: 0 }
            soldValue: { type: number, minimum: 0 }
            bought: { type: integer, minimum: 0 }
            boughtValue: { type: number, minimum: 0 }
            openOrders: { type: integer, minimum: 0 }
        bounty:
          type: object
          required: [onHead, claimed, claimedValue, claimedOn]
          properties:
            onHead: { type: number, minimum: 0, description: Bounty currently on this player. }
            claimed: { type: integer, minimum: 0, description: Bounties this player has collected. }
            claimedValue: { type: number, minimum: 0, description: Total this player has collected. }
            claimedOn: { type: integer, minimum: 0, description: Times a bounty on this player was collected. }
        netWorth:
          type: object
          required: [total, rank]
          properties:
            total: { type: number, minimum: 0, description: 'Public net worth, valued from published shop prices.' }
            rank: { type: integer, minimum: 0, description: Position in the net-worth ranking. }
    PlayerStats:
      type: object
      required: [uuid, name, survival]
      properties:
        uuid: { $ref: '#/components/schemas/Uuid' }
        name: { $ref: '#/components/schemas/PlayerName' }
        survival: { $ref: '#/components/schemas/SurvivalStats' }
    Achievement:
      type: object
      required: [id, name, description, progress, target, complete, unlockedAt]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { type: string, maxLength: 2048 }
        progress: { type: number, minimum: 0 }
        target: { type: number, minimum: 0, description: Value of `progress` that completes it. }
        complete: { type: boolean }
        unlockedAt:
          type: [string, 'null']
          format: date-time
          description: ISO 8601 UTC instant, or `null` while incomplete.
    PlayerProgression:
      type: object
      required: [uuid, name, level, experience, progress, target, maxed]
      properties:
        uuid: { $ref: '#/components/schemas/Uuid' }
        name: { $ref: '#/components/schemas/PlayerName' }
        level: { type: integer, minimum: 0, description: Network level. }
        experience: { type: number, minimum: 0, description: Total network experience. }
        progress: { type: number, minimum: 0, description: Experience earned into the current level. }
        target: { type: number, minimum: 0, description: 'Experience the current level spans; `0` once `maxed`.' }
        maxed: { type: boolean, description: 'True at the highest network level, where `progress` and `target` are `0`.' }
        achievements:
          type: array
          description: Public achievements. Omitted when the network has not published them.
          items: { $ref: '#/components/schemas/Achievement' }
    PlayerTeam:
      type: object
      required: [uuid, name, team]
      properties:
        uuid: { $ref: '#/components/schemas/Uuid' }
        name: { $ref: '#/components/schemas/PlayerName' }
        team:
          description: '`null` when the player is not in a team.'
          oneOf:
            - $ref: '#/components/schemas/TeamSummary'
            - type: 'null'
    CrateKey:
      type: object
      required: [crateId, keyType, available]
      properties:
        crateId: { $ref: '#/components/schemas/Id' }
        keyType: { $ref: '#/components/schemas/Id' }
        available:
          type: [integer, 'null']
          minimum: 0
          description: Usable keys. `0` is a known empty balance; `null` means unknown.
    PlayerCrateKeys:
      type: object
      required: [uuid, name, keys]
      properties:
        uuid: { $ref: '#/components/schemas/Uuid' }
        name: { $ref: '#/components/schemas/PlayerName' }
        keys:
          type: array
          maxItems: 1000
          description: One entry per published crate. A crate that is absent is unknown, not zero.
          items: { $ref: '#/components/schemas/CrateKey' }
    LeaderboardType:
      type: string
      enum: [kills, playtime, wins, networth]
    LeaderboardPeriod:
      type: string
      enum: [daily, weekly, monthly, all_time]
    LeaderboardIndex:
      type: object
      description: |
        Available types and periods. Use `boards` to find valid type/period pairs.
      required: [types, periods, boards]
      properties:
        types:
          type: array
          items: { $ref: '#/components/schemas/LeaderboardType' }
        periods:
          type: array
          items: { $ref: '#/components/schemas/LeaderboardPeriod' }
        boards:
          type: object
          description: Keyed by board type.
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/LeaderboardPeriod' }
    LeaderboardRow:
      type: object
      required: [rank, uuid, name, value]
      properties:
        rank: { type: integer, minimum: 1, description: 'Position in this response, starting at 1.' }
        uuid: { $ref: '#/components/schemas/Uuid' }
        name:
          description: The username recorded when the board was computed; it can be out of date.
          $ref: '#/components/schemas/PlayerName'
        value:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Display value, such as `3d 4h` or `$2.83B`. Use player statistics for
            numeric calculations.
    Leaderboard:
      type: object
      required: [type, period, rows, stale]
      properties:
        type: { $ref: '#/components/schemas/LeaderboardType' }
        period: { $ref: '#/components/schemas/LeaderboardPeriod' }
        rows:
          type: array
          maxItems: 15
          description: |
            Up to 15 players in rank order. Players not publicly visible at the cutoff
            are excluded, and remaining ranks are renumbered. Empty boards return `[]`.
          items: { $ref: '#/components/schemas/LeaderboardRow' }
        stale:
          type: boolean
          description: |
            True if the board is over five minutes older than the cutoff, or its period
            has ended. Networth updates daily and uses a 26-hour threshold. Stale boards
            still return their last approved results.
        windowStart:
          type: string
          format: date-time
          description: |
            Period start in ISO 8601 UTC, omitted for `all_time`. Periods follow
            America/New_York time and start at midnight: daily, Fridays for weekly,
            and the 1st for monthly. UTC offsets change with daylight saving time.
        windowEnd:
          type: string
          format: date-time
          description: ISO 8601 UTC instant the period ends. Omitted for `all_time`.
